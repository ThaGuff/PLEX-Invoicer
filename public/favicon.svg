<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <!-- Crown - lime #C6E404 -->
  <!-- Left point -->
  <polygon points="12,42 12,22 26,32" fill="#C6E404"/>
  <!-- Center point (tallest) -->
  <polygon points="38,42 50,12 62,42" fill="#C6E404"/>
  <!-- Right point -->
  <polygon points="74,22 88,42 74,32" fill="#C6E404"/>
  <!-- Crown base -->
  <rect x="12" y="34" width="76" height="16" rx="3" fill="#C6E404"/>
  <!-- Diamond top center -->
  <polygon points="50,8 54,14 50,18 46,14" fill="#C6E404"/>
  <!-- Document body - charcoal #1A1A1A -->
  <!-- Outer frame -->
  <path d="M18,46 L18,88 Q18,92 22,92 L70,92 Q74,92 74,88 L74,60 L62,46 Z" fill="#1A1A1A"/>
  <!-- Folded corner detail -->
  <polygon points="62,46 74,60 62,60" fill="#C6E404"/>
  <!-- White paper interior -->
  <rect x="24" y="54" width="38" height="32" rx="1" fill="#FFFFFF"/>
  <!-- Text lines - charcoal -->
  <rect x="27" y="60" width="28" height="4" rx="2" fill="#1A1A1A"/>
  <rect x="27" y="68" width="22" height="4" rx="2" fill="#1A1A1A"/>
  <rect x="27" y="76" width="25" height="4" rx="2" fill="#C6E404"/>
</svg>
