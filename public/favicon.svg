<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0D1A0D"/>
  <!-- Vertical stroke -->
  <rect x="24" y="19" width="10" height="62" rx="5" fill="#3DD68C"/>
  <!-- Top arm of R bowl -->
  <rect x="33" y="19" width="28" height="10" rx="5" fill="#3DD68C"/>
  <!-- Bottom arm of R bowl / crossbar -->
  <rect x="33" y="43" width="24" height="10" rx="5" fill="#3DD68C"/>
  <!-- Right side of bowl (semicircle approximated as rect+circle) -->
  <rect x="55" y="19" width="10" height="34" rx="5" fill="#3DD68C"/>
  <!-- Leg diagonal — rotated rectangle approximated -->
  <line x1="35" y1="51" x2="72" y2="81" stroke="#3DD68C" stroke-width="11" stroke-linecap="round"/>
  <!-- Lime accent dot -->
  <circle cx="72" cy="27" r="5" fill="#C8FF00"/>
</svg>